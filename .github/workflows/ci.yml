name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --only-group dev
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .

  test:
    name: Unit tests
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      # Unit tests never call ffmpeg (those are marked integration), so no apt step here.
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Pytest (unit) with coverage
        run: >-
          uv run pytest -m "not integration"
          --cov=social2shorts --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  integration:
    name: Integration tests (ffmpeg)
    timeout-minutes: 25
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Static build from GitHub releases: seconds to fetch (the Ubuntu mirror can stall for
      # minutes) and close to the recent ffmpeg a Windows user installs.
      - name: Install ffmpeg (static build)
        timeout-minutes: 5
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/ffmpeg.tar.xz" \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ffmpeg-master-latest-linux64-gpl/bin" >> "$GITHUB_PATH"
      - run: ffmpeg -hide_banner -version | head -1
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Pytest (integration)
        run: uv run pytest -m integration

  windows-smoke:
    name: Windows smoke
    timeout-minutes: 25
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Check the pywin32 marker resolved
        run: uv run python -c "import win32com.client; print('pywin32 OK')"
      - name: Pytest (unit)
        run: uv run pytest -m "not integration" -q

  docs:
    name: Docs build
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Build (strict)
        run: uv run --locked --group docs mkdocs build --strict
