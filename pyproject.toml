[project]
name = "social2shorts"
version = "0.1.0"
description = "Republish curated TikTok/Instagram videos as YouTube Shorts"
requires-python = ">=3.12,<3.13"
dependencies = [
    "av>=19.0.1",
    "faster-whisper>=1.2.1",
    "google-api-python-client>=2.201.0",
    "google-auth-httplib2>=0.4.4",
    "google-auth-oauthlib>=1.5.0",
    "google-generativeai>=0.8.6",
    "imagehash>=4.3.2",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pywin32>=312",
    "rich>=15.0.0",
    "typer>=0.27.3",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
social2shorts = "social2shorts.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/social2shorts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
