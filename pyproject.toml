[project]
name = "social2shorts"
version = "0.1.0"
description = "Turn TikTok/Instagram reels and raw moto footage into monetization-safe YouTube Shorts"
requires-python = ">=3.12,<3.13"
dependencies = [
    "av>=19.0.1",
    "faster-whisper>=1.2.1",
    "google-api-python-client>=2.201.0",
    "google-auth-httplib2>=0.4.4",
    "google-auth-oauthlib>=1.5.0",
    "google-genai>=2.33.0",
    "imagehash>=4.3.2",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pywin32>=312; sys_platform == 'win32'",
    "rich>=15.0.0",
    "typer>=0.27.3",
    "tzdata>=2026.5",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
social2shorts = "social2shorts.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/social2shorts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = ["--strict-markers"]
markers = ["integration: end-to-end tests using real ffmpeg (deselect with -m 'not integration')"]

[tool.coverage.run]
source = ["social2shorts"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:", ": \\.\\.\\.$"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.8",
]
