[project]
name = "insta2youtube"
version = "0.1.0"
description = "Republish curated TikTok/Instagram videos as YouTube Shorts"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
insta2youtube = "insta2youtube.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insta2youtube"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
